          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      security:
      - JavaWebToken: []
  /cargosoft/shipment/{shipmentId}/event:
    post:
      tags:
      - Shipment
      summary: Create a shipment event
      description: 'Create a shipment event of the given event type. '
      operationId: create_1
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        schema:
          $ref: "#/components/schemas/EventType"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentEvent"
            examples:
              ShipmentEventExample:
                summary: Example of a shipment event
                description: Create event
                $ref: ./resources/Shipment_event_example_object.yaml
      responses:
        "200":
          description: The event has been created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentEvent"
              examples:
                ShipmentEventExample:
                  summary: Example of a shipment event
                  description: TBD
                  $ref: ./resources/Shipment_event_example_object.yaml
      security:
      - JavaWebToken: []
  /cargosoft/shipment/{shipmentId}/event/{id}:
    put:
      tags:
      - Shipment
      summary: Update a shipment event
      description: 'Update the event of the given event type. '
      operationId: update
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        schema:
          $ref: "#/components/schemas/EventType"
      - name: id
        in: path
        description: Database id of the record you want to update.
        required: true
        schema:
          $ref: "#/components/schemas/ShipmentEventQualifier"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentEvent"
            examples:
              ShipmentEventUpdateExample:
                summary: Full update
                description: Update DTO
                $ref: ./resources/Shipment_event_example_object.yaml
              ShipmentEventMinimalUpdateExample:
                summary: Minimal update
                description: Minimal update DTO example
                $ref: ./resources/Shipment_event_update_example.yaml
      responses:
        "200":
          description: The event has been updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentEvent"
              examples:
                ShipmentEventExample:
                  summary: Example of a shipment event
                  description: TBD
                  $ref: ./resources/Shipment_event_example_object.yaml
      security:
      - JavaWebToken: []
  /cargosoft/shipment/memo/lookup:
    post:
      tags:
      - ShipmentMemo
      summary: Lookup shipment memo lines
      description: "Looks up order memo lines (eamemo_t) attached to a shipment, typically\
        \ by client and shipment_number together (the shipment they were created for)."
      operationId: lookup_3
      parameters:
      - name: page_no
        in: query
        description: The page number for pagination.
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: The page size for pagination.
        schema:
          type: integer
          format: int32
          default: 50
      - name: order_by
        in: query
        description: The order by for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            enum:
            - ID
            - SHIPMENT_NUMBER
            - CLIENT
      - name: order_mode
        in: query
        description: The order mode for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            description: Description of the order mode for ordering API results sending
              back as response
            enum:
            - ASC
            - DESC
            x-enumDescriptions:
              ASC: ascending
              DESC: descending
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Identifier"
            examples:
              LookupShipmentMemoIdentifierExample:
                summary: Example of looking up the memo lines attached to a shipment
                description: LookupShipmentMemoIdentifierExample
                $ref: ./resources/Lookup_shipmentmemo_example.yaml
      responses:
        "200":
          description: Records found
          headers:
            X-Page-Count:
              description: The total number of pages for pagination.
              required: true
              style: simple
              schema: {}
            X-Row-Count:
              description: The total number of found objects for pagination.
              required: true
              style: simple
              schema: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShipmentMemo"
              examples:
                ShipmentMemoExample:
                  summary: Example of a shipment memo line
                  description: ShipmentMemoExample
                  $ref: ./resources/ShipmentMemo_lookup_example_object.yaml
      security:
      - JavaWebToken: []
  /cargosoft/shipment/memo:
    get:
      tags:
      - ShipmentMemo
      summary: Retrieve all shipment memo lines
      description: Scroll through all existing shipment memo line records.
      operationId: retrieveAll_1
      parameters:
      - name: page_no
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      - name: cascade
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Records retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShipmentMemo"
      security:
      - JavaWebToken: []
  /cargosoft/shipment/memo/{id}:
    get:
      tags:
      - ShipmentMemo
      summary: Retrieve shipment memo line
      description: Retrieve a specific shipment memo line record with the CargoSoft
        database id.
      operationId: retrieveById_3
      parameters:
      - name: id
        in: path
        description: Database id of the record you want to retrieve
        required: true
        schema:
          type: integer
          format: int32
      - name: cascade
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Record retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentMemo"
      security:
      - JavaWebToken: []
  /auth/token:
    post:
      tags:
      - Authorization
      summary: Retrieve JWT
      description: Retrieve a Java Web Token to authenticate against the API
      operationId: retrieveAuthToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Your username
                password:
                  type: string
                  description: Your password
              required:
              - password
              - username
      responses:
        "200":
          description: Java Web Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwt"
        "401":
          description: Wrong username and/or password
components:
  schemas:
    CodeConvertion:
      type: object
      description: "An EDI code conversion (edicodes_t) translates an external partner's\
        \ own code (e.g. for a charge type or packaging code) into the corresponding\
        \ CargoSoft internal code, or vice versa, depending on direction."
      properties:
        id:
          type: integer
          format: int32
          description: The id of the EDI code conversion.
        client:
          type: string
          description: The CargoSoft client this EDI code conversion belongs to.
        edipartner:
          type: string
          description: The matchcode of the EDI partner this EDI code conversion applies
            to.
        direction:
          type: string
          description: The direction the code conversion applies to.
          enum:
          - RECEIVE
          - SEND
        code_type:
          type: string
          description: The code table/type this conversion applies to (e.g. a charge
            type or packaging code table).
        source_code:
          type: string
          description: The source code to be converted.
        target_code:
          type: string
          description: "The CargoSoft internal (or, depending on direction, external)\
            \ code the source code is converted to."
    ContainsIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: This identifier should use when value have to contain.
      title: ContainsIdentifier
    EqualsIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: The equals identifier should use to match the value exactly.
      title: EqualsIdentifier
    GreaterEqualIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: This identifier should use when the value is greater or equals.
      title: GreaterEqualIdentifier
    GreaterThanIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: This identifier should use when the value is greater than.
      title: GreaterThanIdentifier
    Identifier:
      type: object
      description: Description of the Identifier DTO schema. This DTO contains the
        match mode and identifiers of a functional object for instance the shipment
        identifier.
      discriminator:
        propertyName: matchMode
        mapping:
          EqualsIdentifierMapped: "#/components/schemas/EqualsIdentifier"
          ContainsIdentifierMapped: "#/components/schemas/ContainsIdentifier"
          InIdentifierMapped: "#/components/schemas/InIdentifier"
          OrIdentifierMapped: "#/components/schemas/OrIdentifier"
          GreaterThanIdentifierMapped: "#/components/schemas/GreaterThanIdentifier"
          LessThanIdentifierMapped: "#/components/schemas/LessThanIdentifier"
          GreaterEqualIdentifierMapped: "#/components/schemas/GreaterEqualIdentifier"
          LessEqualIdentifierMapped: "#/components/schemas/LessEqualIdentifier"
      properties:
        key:
          description: Identifier key. For instance a ShipmentIdentifier
        match_mode:
          type: string
          default: EQUALS
          description: The match mode.
          enum:
          - EQUALS
          - CONTAINS
          - IN
          - OR
          - GT
          - LT
          - GE
          - LE
          x-enumDescriptions:
            OR: Or.
            EQUALS: Equals.
            IN: In.
            LT: Lower than.
            LE: Lower equals
            CONTAINS: Contains
            GT: Greater than.
            GE: Greater equals
    IdentifierLookupIdentifier:
      type: object
      description: Description of the Identifier DTO schema. This DTO contains the
        match mode and identifiers of a functional object for instance the shipment
        identifier.
      discriminator:
        propertyName: matchMode
        mapping:
          EqualsIdentifierMapped: "#/components/schemas/EqualsIdentifier"
          ContainsIdentifierMapped: "#/components/schemas/ContainsIdentifier"
          InIdentifierMapped: "#/components/schemas/InIdentifier"
          OrIdentifierMapped: "#/components/schemas/OrIdentifier"
          GreaterThanIdentifierMapped: "#/components/schemas/GreaterThanIdentifier"
          LessThanIdentifierMapped: "#/components/schemas/LessThanIdentifier"
          GreaterEqualIdentifierMapped: "#/components/schemas/GreaterEqualIdentifier"
          LessEqualIdentifierMapped: "#/components/schemas/LessEqualIdentifier"
      properties:
        key:
          description: Identifier key. For instance a ShipmentIdentifier
        match_mode:
          type: string
          default: EQUALS
          description: The match mode.
          enum:
          - EQUALS
          - CONTAINS
          - IN
          - OR
          - GT
          - LT
          - GE
          - LE
          x-enumDescriptions:
            OR: Or.
            EQUALS: Equals.
            IN: In.
            LT: Lower than.
            LE: Lower equals
            CONTAINS: Contains
            GT: Greater than.
            GE: Greater equals
    InIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: This identifier should use when more than one value can be match.
      title: InIdentifier
    LessEqualIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: This identifier should use when the value is less or equals.
      title: LessEqualsIdentifier
    LessThanIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: This identifier should use when the value is less than.
      title: LessThanIdentifier
    LookupIdentifier: {}
    OrIdentifier:
      allOf:
      - $ref: "#/components/schemas/IdentifierShipmentMemoIdentifier"
      description: This identifier combines a list of identifier with the logical
        or.
      title: OrIdentifier
    IdentifierCodeConverterIdentifier:
      type: object
      description: Description of the Identifier DTO schema. This DTO contains the
        match mode and identifiers of a functional object for instance the shipment
