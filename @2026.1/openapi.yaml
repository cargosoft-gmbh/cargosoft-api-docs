          description: The origin used for route-related calculation information.
        destination:
          $ref: "#/components/schemas/ShipmentCalculationLocation"
          description: The destination used for route-related calculation information.
        collect_prepaid:
          type: string
          description: The collect or prepaid indicator of the calculation line.
        contract_number:
          type: string
          description: The contract number associated with the calculation line.
        quotation_number:
          type: string
          description: The quotation number associated with the calculation line.
        ecm_booking:
          type: boolean
          description: Indicates whether this calculation line is booked manually
            in ECM.
        ordering:
          type: integer
          format: int32
          description: The sequence number controlling the order of calculation lines.
