      properties:
        id:
          type: integer
          format: int64
          description: The unique ID of this document.
        client:
          type: string
          description: The CargoSoft client.
        description:
          type: string
          description: Description of this document.
        bytes:
          type: string
          format: Base64 encoded String
          description: Base64 encoded content of this document.
        roles:
          type: array
          description: The list of roles. The roles are a kind of authorization as
            to who may view the documents.
          items:
            type: string
        references:
          type: array
          description: A list of references.
          items:
            $ref: "#/components/schemas/EFileReference"
        document_category:
          type: integer
          format: int32
          description: The category of this document. The category is defined in the
            CargoSoft basic data and is individual for each customer.
        document_name:
          type: string
          description: The file name of this document.
        document_date:
          type: string
          format: date-time
          description: Date of creation of this document.
    EFileReference:
      type: object
      description: Description of the EFileReference DTO schema for efile references.
      properties:
        reference_type:
          type: string
          description: "Each reference is typified. The type describes the reference\
            \ value. For example [CSFILE, ADRFILE]. CSFILE = The document is attached\
            \ to a shipment, ADRFILE = The document is attached to an address."
          examples:
          - CSFILE
          - ADRFILE
        reference_value:
          type: string
          description: The reference value.
    EFileRole:
      type: object
      properties:
        role:
          type: string
    EFileLookupGenericClass:
      type: object
      anyOf:
      - $ref: "#/components/schemas/EqualsIdentifier"
      - $ref: "#/components/schemas/GreaterThanIdentifier"
