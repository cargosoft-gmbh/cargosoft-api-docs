          $ref: "#/components/schemas/ShipmentEventQualifier"
          description: The event code of this shipment event. The code describes the
            functional meaning of the event date and time.
        type:
          $ref: "#/components/schemas/EventType"
          description: The event type of this shipment event. The event type describes
            if the event date and time is estimated or actual.
        shipment_id:
          type: integer
          format: int32
          description: The id of the Shipment.
        date_time:
          $ref: "#/components/schemas/EventDateAndTime"
          description: The date and time of this event.
        location:
          $ref: "#/components/schemas/Location"
          description: The location of this event.
    ShipmentEventQualifier:
      type: string
      description: The following list will give an overview about the shipment events
        and a short description.
      enum:
      - DISPATCH
      - PICKUP
      - WAREHOUSE
      - POL_ARRIVAL
      - LOADING_START
      - LOADING_END
      - POL_DEPARTURE
      - POD_ARRIVAL
      - CLEARANCE_START
      - CLEARANCE_END
      - CUSTOMS_CLEARANCE
      - AVAILABLE
      - ACCEPTANCE
      - FINAL_DESTINATION
      - TRANSSHIPMENT
      - GATE_OUT
      - POD_DEPARTURE
      - CUSTOMS_RELEASE
      - DELIVERY_DATE
      - POL_DEPARTURE_REVISED
      - POD_ARRIVAL_REVISED
      - TRANSSHIPMENT_ARRIVAL
      - TRANSSHIPMENT_DEPARTURE
      - DIFF_BL_DATE
      - VGM_CLOSING
      x-enumDescriptions:
        GATE_OUT: TBD.
        TRANSSHIPMENT: The  goods  are  at  the  transshipment port (seafreight only).
        LOADING_START: The goods will be loaded into the vessel / airplane.
        LOADING_END: The goods are loaded into the vessel airplane.
        POL_ARRIVAL: The goods arrived the port of loading.
        CUSTOMS_CLEARANCE: The goods are cleared by customs.
        POD_DEPARTURE: TBD.
        POL_DEPARTURE: The  goods  are  departured  (ETD  and ATD).
        POL_DEPARTURE_REVISED: The  goods  are  departured  (revised Date).
        POD_ARRIVAL_REVISED: The goods arrived at the port of discharge (revised Date).
        POD_ARRIVAL: The goods arrived at the port of discharge (ETA and ATA).
        ACCEPTANCE: The goods can be picked up at the port.
        PICKUP: The  goods  are  picked  up  from  the starting location.
        VGM_CLOSING: VGM Closing Date and Time
        DIFF_BL_DATE: The  B/L  date  has  changed  from  theinitial value
        TRANSSHIPMENT_DEPARTURE: The  goods  have  departed  from  thetransshipment  port  and  are  on  theirway
          to the next destination.
        WAREHOUSE: The goods are within the warehouse.
        CLEARANCE_END: The goods are cleared.
        FINAL_DESTINATION: The goods are at the final destination.
        DISPATCH: The goods were dispatched.
        CUSTOMS_RELEASE: TBD.
        AVAILABLE: The goods are available at the port.
        DELIVERY_DATE: TBD.
        CLEARANCE_START: The goods will be cleared.
        TRANSSHIPMENT_ARRIVAL: The goods have arrived at the transshipment port and
          are ready for further transportation
    ShipmentMemo:
      type: object
      description: "One line of the order memo (eamemo_t) attached to a shipment.\
        \ A memo text longer than the maximum line length is automatically wrapped\
        \ across several consecutive lines (same client/shipment_number, running_number\
        \ incrementing by one) when the shipment is created."
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of this memo line.
        client:
          type: string
          description: The CargoSoft client.
        memo:
          type: string
          description: The memo text of this line.
        shipment_number:
          type: string
          description: The CargoSoft shipment number this memo line belongs to.
        running_number:
          type: integer
          format: int32
          description: "The running number (eamemo_t.lfd_nr) of this line within the\
            \ shipment's memo, starting at 1 - assigned automatically on create, not\
            \ settable by the caller."
