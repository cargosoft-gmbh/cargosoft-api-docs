openapi: 3.1.0
info:
  title: CargoSoft API
  description: 
    $ref: ./resources/api_info_description.md
  contact:
    name: Uwe Droste
    url: https://www.cargosoft.de
    email: support@cargosoft.de
  version: '2026.1'
  x-logo:
    backgroundColor: "#FFFFF"
    altText: CargoSoft GmbH
    url: https://raw.githubusercontent.com/cargosoft-gmbh/cargosoft-api-docs/2026.1/resources/CargoSoftLogo.jpg
servers:
- url: https://api-demo.cargosoft.de
  description: Test CargoSoft API server.
tags:
- name: Basic data
  description: "Lookup of EDI code conversions (edicodes_t): translates an EDI partner's\
    \ own code into the corresponding CargoSoft internal code, or vice versa."
- name: Shipment
  description: The following chapter will give you an overview about the shipment
    endpoints and their function.
- name: ShipmentMemo
  description: Lookup of order memo lines (eamemo_t) attached to a shipment.
paths:
  /cargosoft/basicdata/codeconverter/lookup:
    post:
      tags:
      - Basic data
      summary: Lookup EDI code conversion
      description: "Looks up EDI code conversions (edicodes_t) by EDI partner, direction,\
        \ code table/type and/or source code. The DIRECTION identifier value must\
        \ be the raw single-character edicodes_t.richtung code (\"E\" or \"S\"), not\
        \ the EdiCodeDirectionEnum enum name used on the response. Two identifier\
        \ combinations are served from a cache (see CodeConverterServiceBean) since\
        \ this master data changes very rarely: EDIPARTNER+DIRECTION+CODETYPE (all\
        \ code conversions for a partner's table/direction), and EDIPARTNER+DIRECTION+CODETYPE+SOURCECODE\
        \ (a single, specific conversion). Omitting EDIPARTNER for a DIRECTION+CODETYPE+SOURCECODE\
        \ lookup returns every matching conversion across all EDI partners that share\
        \ the same source code, also served from a cache. Any other identifier combination\
        \ runs directly against the database."
      operationId: lookup
      parameters:
      - name: page_no
        in: query
        description: The page number for pagination.
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: The page size for pagination.
        schema:
          type: integer
          format: int32
          default: 50
      - name: order_by
        in: query
        description: The order by for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            enum:
            - CLIENT
            - EDIPARTNER
            - DIRECTION
            - CODETYPE
            - SOURCECODE
      - name: order_mode
        in: query
        description: The order mode for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            description: Description of the order mode for ordering API results sending
              back as response
            enum:
            - ASC
            - DESC
            x-enumDescriptions:
              ASC: ascending
              DESC: descending
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Identifier"
            examples:
              LookupCodeConverterIdentifierExample:
                summary: Example of looking up all EDI code conversions of an EDI
                  partner for a direction and code table
                description: LookupCodeConverterIdentifierExample
                $ref: ./resources/Lookup_codeconverter_example.yaml
      responses:
        "200":
          description: Records found
          headers:
            X-Page-Count:
              description: The total number of pages for pagination.
              required: true
              style: simple
              schema: {}
            X-Row-Count:
              description: The total number of found objects for pagination.
              required: true
              style: simple
              schema: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodeConvertion"
              examples:
                CodeConvertionExample:
                  summary: Example of an EDI code conversion
                  description: CodeConvertionExample
                  $ref: ./resources/CodeConvertion_lookup_example_object.yaml
      security:
      - JavaWebToken: []
  /cargosoft/basicdata/codeconverter:
    get:
      tags:
      - Basic data
      summary: Retrieve all EDI code conversions
      description: Scroll through all existing EDI code conversion records.
      operationId: retrieveAll
      parameters:
      - name: page_no
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      - name: cascade
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Records retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodeConvertion"
      security:
      - JavaWebToken: []
  /cargosoft/basicdata/codeconverter/{id}:
    get:
      tags:
      - Basic data
      summary: Retrieve EDI code conversion
      description: Retrieve a specific EDI code conversion record with the CargoSoft
        database id.
      operationId: retrieveById
      parameters:
      - name: id
        in: path
        description: Database id of the record you want to retrieve
        required: true
        schema:
          type: integer
          format: int32
      - name: cascade
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Record retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeConvertion"
      security:
      - JavaWebToken: []
  /cargosoft/efile:
    post:
      tags:
      - E-File
      summary: Create an E-File document.
      description: Stores a base64 encoded document in E-File and links it to the
        supplied references and roles.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EFile"
      responses:
        "200":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EFile"
      security:
      - JavaWebToken: []
  /cargosoft/efile/{id}/reference:
    get:
      tags:
      - E-File
      summary: Retrieve references from an E-File document.
      description: Retrieves all references linked to an E-File document.
      operationId: retrieveReferencesFromDocument
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: References retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EFileReference"
      security:
      - JavaWebToken: []
    post:
      tags:
      - E-File
      summary: Add a reference to an E-File document.
      description: "Adds a reference, such as a shipment or address reference, to\
        \ an existing E-File document."
      operationId: createReferenceForDocument
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EFileReference"
      responses:
        "200":
          description: Reference added.
      security:
      - JavaWebToken: []
    delete:
      tags:
      - E-File
      summary: Remove a reference from an E-File document.
      description: Removes a reference from an existing E-File document.
      operationId: deleteReferenceFromDocument
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EFileReference"
      responses:
        "200":
          description: Reference removed.
      security:
      - JavaWebToken: []
  /cargosoft/efile/{id}/role:
    get:
      tags:
      - E-File
      summary: Retrieve roles from an E-File document.
      description: Retrieves all authorization roles linked to an E-File document.
      operationId: retrieveRolesFromDocument
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Roles retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EFileRole"
      security:
      - JavaWebToken: []
    post:
      tags:
      - E-File
      summary: Add a role to an E-File document.
      description: Adds an authorization role to an existing E-File document.
      operationId: createRoleForDocument
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Role added.
      security:
      - JavaWebToken: []
    delete:
      tags:
      - E-File
      summary: Remove a role from an E-File document.
      description: Removes an authorization role from an existing E-File document.
      operationId: deleteRoleFromDocument
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EFileRole"
      responses:
        "200":
          description: Role removed.
      security:
      - JavaWebToken: []
  /cargosoft/efile/{id}:
    get:
      tags:
      - E-File
      summary: Retrieve an E-File document.
      description: Retrieves a single E-File document by its document ID.
      operationId: retrieveById_1
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int32
      - name: cascade
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Record retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EFile"
      security:
      - JavaWebToken: []
    delete:
      tags:
      - E-File
      summary: Delete an E-File document.
      description: Deletes an E-File document by its document ID.
      operationId: delete
      parameters:
      - name: id
        in: path
        description: E-File document ID.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Record deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EFile"
      security:
      - JavaWebToken: []
  /cargosoft/efile/lookup:
    post:
      tags:
      - E-File
      summary: Lookup E-File documents.
      description: Looks up electronic documents such as PDF files by the supplied
        lookup identifiers.
      operationId: lookup_1
      parameters:
      - name: page_no
        in: query
        description: The page number for pagination.
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: The page size for pagination.
        schema:
          type: integer
          format: int32
          default: 50
      - name: order_by
        in: query
        description: The order by for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            description: The following list will give an overview about the implemented
              efile identifier and a short description.
            enum:
            - REFERENCE
            - SHIPMENT_ID
            - CLIENT
            title: EFileIdentifier
            x-enumDescriptions:
              SHIPMENT_ID: Unique database ID of the Shipment.
              REFERENCE: "Reference of the efile as <REFERENCE_TYPE>:<REFERENCE_VALUE>,\
                \ for example EDIMON:4711 for the JSON file belonging to the edimonitordatei_t\
                \ row 4711. Must always be combined with a CLIENT identifier - several\
                \ configured efile clients can share the same backend, so searching\
                \ without a client would return the same document once per matching\
                \ client. In most cases, this reference is not known by third party\
                \ applications. For instance, use the SHIPMENT_ID identifier to search\
                \ efile documents."
              CLIENT: "Mandant, required together with REFERENCE to scope the search\
                \ to a single efile client."
      - name: order_mode
        in: query
        description: The order mode for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            description: Description of the order mode for ordering API results sending
              back as response
            enum:
            - ASC
            - DESC
            x-enumDescriptions:
              ASC: ascending
              DESC: descending
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EFileLookupGenericClass"
            examples:
              LookupEFileIdentifierExample:
                summary: Example of looking up electronic documents for a shipment.
                description: LookupEFileIdentifierExample
                $ref: ./resources/Lookup_efile_example.yaml
      responses:
        "200":
          description: Records found
          headers:
            X-Page-Count:
              description: The total number of pages for pagination.
              required: true
              style: simple
              schema: {}
            X-Row-Count:
              description: The total number of found objects for pagination.
              required: true
              style: simple
              schema: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EFile"
              examples:
                ShipmentEFileExample:
                  summary: Example to retrieve shipment documents.
                  description: Example response for shipment documents.
                  $ref: ./resources/Efile_example_object.yaml
      security:
      - JavaWebToken: []
  /cargosoft/shipment:
    post:
      tags:
      - Shipment
      summary: Create shipment
      description: Create a new shipment.
      operationId: createShipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Shipment"
            examples:
              CreateShipmentRequestExampleCollis:
                summary: 'Example of a shipment creation request with addresses and
                  2 collis '
                description: CreateShipmentRequestExampleCollis
                $ref: ./resources/shipment_endpoints/Create_Shipment_example_object_Addresses_2colli.yaml
              CreateShipmentRequestExampleContainer:
                summary: Example of a shipment creation request with addresses and
                  container
                description: CreateShipmentRequestExampleContainer
                $ref: ./resources/shipment_endpoints/Create_Shipment_example_object_Addresses_Container.yaml
      responses:
        "200":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
              examples:
                CreateShipmentResponseExample:
                  summary: Example of a created shipment
                  description: CreateShipmentResponseExample
                  $ref: ./resources/Shipment_example_object_response.yaml
      security:
      - JavaWebToken: []
  /cargosoft/shipment/lookup:
    post:
      tags:
      - Shipment
      summary: Lookup for shipments
      description: "This endpoint looks up shipments. The result should be limit by\
        \ using search criterias in the request body. For a complete list of search\
        \ criteria see the ShipmentIdentifier enumeration below. Depending on the\
        \ search criteria you will receive zero up to n shipments. This endpoint only\
        \ returns the base shipment. If you need the full shipment details, use the\
        \ shipment id to retrieve them separately."
      operationId: lookup_2
      parameters:
      - name: page_no
        in: query
        description: The page number for pagination.
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: The page size for pagination.
        schema:
          type: integer
          format: int32
          default: 50
      - name: order_by
        in: query
        description: The order by for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            description: The following list will give an overview about the implemented
              shipment identifier and a short description.
            enum:
            - ID
            - HBL
            - MBL
            - FILENUMBER
            - SHIPMENT_ID
            - ADDRESS_REFERENCE
            - DIRECTION
            - MODE_OF_TRANSPORT
            - MONTH_OF_SERVICE
            - CLIENT
            - CREATION_DATE
            - RUNNING_SEQUENCE_NUMBER
            - SHIPMENT_NUMBER
            - CUSTOMER_ADDRESS_TYPE
            - CUSTOMER_ADDRESS_NUMBER
            - SHIPMENT_CLOSED
            - LAST_MODIFIED_DATE
            - LAST_MODIFIED_TIME
            title: ShipmentIdentifier
            x-enumDescriptions:
              SHIPMENT_ID: A foreign shipment ID of a third party system. This ID
                should be unique.
              LAST_MODIFIED_TIME: "The time, when the shipment was last modified."
              DIRECTION: "Direction of the shipment. Possible values are [I, E]. I\
                \ = import shipments, E = export shipments."
              CREATION_DATE: System date when the shipment was created.
              LAST_MODIFIED_DATE: "The date, when the shipment was last modified."
              CUSTOMER_ADDRESS_NUMBER: CargoSoft address number of the customer address.
              FILENUMBER: CargoSoft shipment number. The shipment number is unique
                in combination with the client.
              CLIENT: The CargoSoft client.
              HBL: House bl number of the Shipment.
              MBL: Master bL number of the Shipment.
              ADDRESS_REFERENCE: A address reference at any CargoSoft address of the
                shipment.
              RUNNING_SEQUENCE_NUMBER: TBD
              MONTH_OF_SERVICE: TBD
              CUSTOMER_ADDRESS_TYPE: "CargoSoft address type of the customer address.\
                \ Possible values are [D, K, G, P, A]"
              ID: Unique database ID of the Shipment.
              MODE_OF_TRANSPORT: "The mode of the shipment. Possible values are [SEA,\
                \ AIR, RD, RL]."
              SHIPMENT_NUMBER: CargoSoft shipment number. The shipment number is unique
                in combination with the client.
              SHIPMENT_CLOSED: "Flag if the shipment is done. Possible values are\
                \ [J, N]."
      - name: order_mode
        in: query
        description: The order mode for ordering API results sending back as response.
        schema:
          type: array
          items:
            type: string
            description: Description of the order mode for ordering API results sending
              back as response
            enum:
            - ASC
            - DESC
            x-enumDescriptions:
              ASC: ascending
              DESC: descending
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ShipmenLookupGenericClass"
            examples:
              LookupShipmentIdentifierExample:
                summary: Example of looking up shipment
                description: TBD
                $ref: ./resources/Lookup_shipment_example.yaml
      responses:
        "200":
          description: Records found
          headers:
            X-Page-Count:
              description: The total number of pages for pagination.
              required: true
              style: simple
              schema: {}
            X-Row-Count:
              description: The total number of found objects for pagination.
              required: true
              style: simple
              schema: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
              examples:
                ShipmentExample:
                  summary: Example of a shipment
                  description: TBD
                  $ref: ./resources/Shipment_lookup_example_object.yaml
      security:
      - JavaWebToken: []
  /cargosoft/shipment/{id}/airmaincarriage:
    get:
      tags:
      - Shipment
      summary: Retrieve airfreight shipment main carriage
      description: 'Retrieve the airfreight main carriage of the shipment with additional
        details. The CargoSoft Shipment ID is needed to retrieve the main carriage. '
      operationId: retrieveAirMainCarriage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Record retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirfreightCarriageLeg"
              examples:
                ShipmentAirfreightCarriageExportExample:
                  summary: Airfreight export carriage example
                  description: This example contains 2 legs for an export airfright
                    shipment.
                  $ref: ./resources/Retrieve_shipment_airfright_carriage_export_example.yaml
                ShipmentAirfreightCarriageImportExample:
                  summary: Airfreight import carriage example
                  description: This example contains only one leg for a import airfright
                    shipment.
                  $ref: ./resources/Retrieve_shipment_airfright_carriage_import_example.yaml
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
      security:
      - JavaWebToken: []
  /cargosoft/shipment/{id}:
    get:
      tags:
      - Shipment
      summary: Retrieve shipment
      description: Retrieve a specific shipment with the CargoSoft database id.
      operationId: retrieveById_2
      parameters:
      - name: id
        in: path
        description: Database id of the record you want to retrieve
        required: true
        schema:
          type: integer
          format: int32
      - name: cascade
        in: query
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Record retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
      security:
      - JavaWebToken: []
  /cargosoft/shipment/{id}/events:
    get:
      tags:
      - Shipment
      summary: Retrieve shipment events
      description: "This endpoint retrieves all events of the shipment. To retrieve\
        \ the events, the shipment id is needed. It is possible that not all events\
        \ are included in the response because they are not entered or know in the\
        \ shipment unitil now. To retrive the shipment id, use the lookup endpoint\
